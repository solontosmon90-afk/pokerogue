name: Build offline APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4   # reads "packageManager" from package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Fixed signing key
        run: |
          test -f debug.keystore.b64 || (echo "debug.keystore.b64 is missing from the repo root" && exit 1)
          tr -d ' \r\n' < debug.keystore.b64 | base64 -d > debug.keystore
          keytool -list -keystore debug.keystore -storepass android | grep -q androiddebugkey || (echo "keystore text is damaged" && exit 1)
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build web app (login bypassed)
        run: pnpm build:app
        env:
          VITE_BYPASS_LOGIN: "1"

      - name: Add Capacitor
        run: |
          pnpm add @capacitor/core@6 @capacitor/android@6
          pnpm add -D @capacitor/cli@6
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.example.pokerogue",
            "appName": "PokeRogue",
            "webDir": "dist"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Force landscape
        run: |
          sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' \
            android/app/src/main/AndroidManifest.xml

      - name: Use the fixed key in Gradle
        run: |
          test -f android/app/build.gradle || (echo "android/app/build.gradle not found" && exit 1)
          {
            echo ""
            echo "android {"
            echo "    signingConfigs {"
            echo "        debug {"
            echo "            storeFile file('$GITHUB_WORKSPACE/debug.keystore')"
            echo "            storePassword 'android'"
            echo "            keyAlias 'androiddebugkey'"
            echo "            keyPassword 'android'"
            echo "        }"
            echo "    }"
            echo "}"
          } >> android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: pokerogue-offline-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
